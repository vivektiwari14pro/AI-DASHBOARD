<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUDRAKSHA ENTERPRISES DASHBOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet"><style id="appCss">:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECEFF1; --surface:#FFFFFF; --ink:#15232B; --muted:#586873; --line:#D4DBE0; --line-soft:#E6EBEE;
  --primary:#0E5A4B; --primary-ink:#FFFFFF; --primary-soft:#DDEEE8;
  --accent:#F0B323; --hover:#F3F6F7;
  --c1:#0E7A63; --c2:#2C6DB4; --c3:#C98500; --c4:#7C5BA8; --c5:#C4533A;
  --paid:#0E7A4B; --paid-bg:#DCF1E6; --recv:#8A5A00; --recv-bg:#FBEBC6; --unl:#3F4E58; --unl-bg:#E3E8EB;
  --shadow:0 1px 0 rgba(21,35,43,.04), 0 6px 20px -12px rgba(21,35,43,.25);
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1418; --surface:#152128; --ink:#E5EDF1; --muted:#95A7B1; --line:#2A3B45; --line-soft:#1F2F38;
    --primary:#0B4A3E; --primary-soft:#173A33; --hover:#1B2A32;
    --c1:#3CBE9D; --c2:#6AA5E6; --c3:#F0B323; --c4:#B394DE; --c5:#EE8468;
    --paid:#5FD3A0; --paid-bg:#173A2D; --recv:#F2C65C; --recv-bg:#3A2F12; --unl:#B6C4CC; --unl-bg:#25353E;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 6px 20px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#152128; --ink:#E5EDF1; --muted:#95A7B1; --line:#2A3B45; --line-soft:#1F2F38;
  --primary:#0B4A3E; --primary-soft:#173A33; --hover:#1B2A32;
  --c1:#3CBE9D; --c2:#6AA5E6; --c3:#F0B323; --c4:#B394DE; --c5:#EE8468;
  --paid:#5FD3A0; --paid-bg:#173A2D; --recv:#F2C65C; --recv-bg:#3A2F12; --unl:#B6C4CC; --unl-bg:#25353E;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 6px 20px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num,.mono{font-variant-numeric:tabular-nums}

/* Masthead */
.masthead{background:var(--primary);color:#fff;padding:22px clamp(16px,4vw,40px) 26px;position:relative}
.masthead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 34px,transparent 34px 56px)}
.masthead .row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;max-width:1360px;margin:0 auto}
.masthead h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,5vw,50px);line-height:1;margin:0;letter-spacing:.005em}
.masthead p{margin:6px 0 0;opacity:.85;font-size:15px}
.theme-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px}
.theme-btn:hover{background:rgba(255,255,255,.2)}

/* Actions + notice */
.actions{display:flex;gap:8px;flex-wrap:wrap}
.theme-btn[hidden]{display:none}
.notice{margin:0 0 12px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14.5px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.notice[hidden]{display:none}
.notice.ok{border-color:var(--paid);background:var(--paid-bg)}
.notice.warn{border-color:var(--accent);background:var(--recv-bg)}
.notice.err{border-color:var(--c5);background:color-mix(in srgb,var(--c5) 14%,var(--surface))}
.nbtns{display:flex;gap:10px;align-items:center;flex-shrink:0}
.notice #noticeX{border:0;background:transparent;font-size:20px;line-height:1;padding:0 4px;color:var(--muted)}
.notice .btn{align-self:auto}
.notice .btn:disabled{opacity:.6;cursor:default}
.drop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(14,90,75,.88);color:#fff;font-family:var(--display);font-size:36px;font-weight:600;text-align:center;padding:20px}
.drop[hidden]{display:none}

/* Toolbar */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.toolbar .in{max-width:1360px;margin:0 auto;padding:12px clamp(16px,4vw,40px);display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.search{flex:1 1 320px;min-width:220px;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:0 76px 0 38px;font-size:16px}
.search input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.search .hint{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted)}
.field select,.field input{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-size:14px;color:var(--ink);max-width:190px}
.field input[type=date]{max-width:150px}
.btn{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 14px;font-size:14px;align-self:flex-end}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn[hidden]{display:none}

main{max-width:1360px;margin:0 auto;padding:18px clamp(16px,4vw,40px) 48px}
.insight{margin:0 0 14px;font-size:16px;color:var(--ink);max-width:90ch}
.insight b{font-weight:600}

/* KPI band */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.kpi{padding:14px 18px 14px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);margin:0 -1px -1px 0}
.kpi .l{font-size:13.5px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:18px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .s{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Cards */
.grid{display:grid;gap:14px;margin-top:14px}
.g-a{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-b{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@media (max-width:980px){.g-a,.g-b{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;line-height:1.1}
.card .sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 12px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.seg button:not([aria-pressed="true"]):hover{background:var(--hover)}

/* trend */
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
.chart .val{fill:var(--ink);font-size:10.5px;font-weight:500}
.chart .grid-l{stroke:var(--line-soft);stroke-width:1}
.chart .bar{fill:var(--primary)}
:root[data-theme="dark"] .chart .bar{fill:var(--c1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chart .bar{fill:var(--c1)}}
.chart .bar.dim{opacity:.35}
.chart .hit{fill:transparent}
.chart .hit.click{cursor:pointer}
.chart .hit.click:hover + .bar{fill:var(--accent)}

/* bar lists */
.blist{display:flex;flex-direction:column;gap:2px}
.blist.scroll{max-height:372px;overflow-y:auto;padding-right:4px}
.brow{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 8px;border-left:3px solid transparent}
.brow:hover{background:var(--hover)}
.brow.on{background:var(--primary-soft);border-left-color:var(--accent)}
.brow .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.brow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .vv{white-space:nowrap;font-variant-numeric:tabular-nums}
.brow .vv b{font-family:var(--display);font-size:20px;font-weight:600}
.brow .vv span{color:var(--muted);font-size:13px;margin-left:8px}
.brow .track{display:block;height:7px;background:var(--line-soft);border-radius:4px;margin-top:4px;overflow:hidden}
.brow .track i{display:block;height:100%;border-radius:4px;background:var(--primary)}
.brow .note{font-size:12.5px;color:var(--muted);margin-top:2px}
.empty-note{color:var(--muted);padding:18px 4px;font-size:14px}

/* status + transit blocks */
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line-soft);margin:8px 0 10px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{font-weight:600;font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--line-soft);margin:16px 0 12px}
.hist{display:flex;align-items:flex-end;gap:10px;height:96px;margin-top:8px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12.5px;color:var(--muted)}
.hist i{display:block;width:100%;max-width:56px;background:var(--c2);border-radius:5px 5px 0 0;min-height:2px}
.hist b{font-weight:600;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}

/* table */
.tcard{margin-top:14px;padding:0;overflow:hidden}
.tcard .card-h{padding:16px 18px 0;margin-bottom:12px}
.tscroll{overflow:auto;max-height:640px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;min-width:1240px}
th{position:sticky;top:0;z-index:2;background:var(--surface);text-align:left;font-weight:600;font-size:13.5px;color:var(--muted);padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;box-sizing:border-box;width:100%;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:4px}
th.r button{justify-content:flex-end}
th button:hover{color:var(--ink);background:var(--hover)}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
th .ar{font-size:11px;opacity:.9;min-width:9px}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr.trip{cursor:pointer}
tbody tr.trip:hover td{background:var(--hover)}
tbody tr.trip:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.passno{font-family:var(--display);font-size:19px;font-weight:600}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:13px;font-weight:500;border:1.5px solid var(--pc,var(--line));color:var(--ink);background:transparent}
.pill.st{border:0}
.pill.paid{background:var(--paid-bg);color:var(--paid)}
.pill.recv{background:var(--recv-bg);color:var(--recv)}
.pill.unl{background:var(--unl-bg);color:var(--unl)}
tr.grp td{background:var(--bg);font-weight:600;cursor:pointer;position:sticky;top:41px;z-index:1;border-bottom:1px solid var(--line)}
tr.grp:hover td{background:var(--primary-soft)}
tr.grp .g-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
tr.grp .car{display:inline-block;width:14px;transition:transform .15s}
tr.grp.closed .car{transform:rotate(-90deg)}
tr.grp .gs{font-weight:400;color:var(--muted);font-size:13.5px}
tfoot td{position:sticky;bottom:0;background:var(--surface);font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px;align-self:auto}

/* money */
.money-h{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:6px}
.mt{padding:11px 14px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);margin:0 -1px -1px 0}
.mt .l{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mt .l em{width:10px;height:10px;border-radius:3px;display:inline-block}
.mt .v{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.mt .s{font-size:12.5px;color:var(--muted)}
.mstack{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line-soft);margin:14px 0 4px}
.mstack i{display:block;height:100%}
.mtscroll{overflow:auto;max-height:340px;margin-top:14px;border:1px solid var(--line);border-radius:10px}
.mtscroll table{min-width:720px;font-size:14px}
.mtscroll th,.mtscroll th span{padding:9px 12px;position:sticky;top:0}
.mtscroll tbody tr.mr{cursor:pointer}
.mtscroll tbody tr.mr:hover td{background:var(--hover)}
.mtscroll tbody tr.mr.on td{background:var(--primary-soft)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,18,22,.5);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:41;box-shadow:-14px 0 40px -18px rgba(0,0,0,.5);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer[hidden],.scrim[hidden]{display:none}
.drawer header{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.drawer header h3{margin:0;font-family:var(--display);font-size:30px;line-height:1;font-weight:700}
.drawer header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.drawer .x{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1}
.drawer .x:hover{background:var(--hover)}
.drawer .body{overflow:auto;padding:6px 18px 24px}
.drawer h4{font-family:var(--display);font-size:18px;font-weight:600;margin:18px 0 6px}
.drawer dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:0}
.drawer dt,.drawer dd{margin:0;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px}
.drawer dt{color:var(--muted)}
.drawer dd{text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

@media (max-width:760px){.toolbar{position:static}}
@media (max-width:640px){
  .kpi .v{font-size:32px}
  .field select,.field input{max-width:none}
  .field{flex:1 1 140px}
  .card{padding:14px}
  .tcard .card-h{padding:14px 14px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style></head><body><template id="skeleton"><header class="masthead">
  <div class="row">
    <div>
      <h1>RUDRAKSHA ENTERPRISES DASHBOARD</h1>
      <p id="period"></p>
    </div>
    <div class="actions">
      <button class="theme-btn" id="uploadBtn" type="button">Upload CSV</button>
      <button class="theme-btn" id="liveBtn" type="button" hidden>Back to live data</button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch colour theme">Dark mode</button>
      <input type="file" id="file" accept=".csv,text/csv" multiple hidden>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="in">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Search pass, truck, transporter" aria-label="Search trips">
      <span class="hint" id="hits" aria-live="polite"></span>
    </label>
    <label class="field">Transporter<select id="fTr"></select></label>
    <label class="field">Permit number<select id="fPermit"></select></label>
    <label class="field">Route<select id="fRoute"></select></label>
    <label class="field">Challan from<input type="date" id="fFrom"></label>
    <label class="field">Challan to<input type="date" id="fTo"></label>
    <button class="btn" id="reset" type="button" hidden>Reset filters</button>
  </div>
</div>

<main>
  <div class="notice" id="notice" role="status" hidden><span id="noticeText"></span><span class="nbtns"><button class="btn primary" type="button" id="pubBtn" hidden>Publish for everyone</button><button type="button" id="noticeX" aria-label="Dismiss message">&times;</button></span></div>
  <p class="insight" id="insight"></p>
  <section class="kpis" id="kpis" aria-label="Key figures"></section>

  <div class="grid g-a">
    <section class="card">
      <div class="card-h">
        <div>
          <h2>Daily movement</h2>
          <p class="sub" id="trendSub"></p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div class="seg" role="group" aria-label="Measure" id="segMetric">
            <button type="button" data-m="trips" aria-pressed="true">Trips</button>
            <button type="button" data-m="mt" aria-pressed="false">UL Net (MT)</button>
          </div>
          <div class="seg" role="group" aria-label="Date basis" id="segBasis">
            <button type="button" data-b="cd" aria-pressed="true">Challan date</button>
            <button type="button" data-b="ud" aria-pressed="false">Unloading date</button>
          </div>
        </div>
      </div>
      <div class="chart" id="trend"></div>
    </section>

    <section class="card">
      <div class="card-h">
        <div>
          <h2>Trips by permit number</h2>
          <p class="sub">Select a permit to filter the whole dashboard</p>
        </div>
      </div>
      <div class="blist" id="permitList"></div>
    </section>
  </div>

  <div class="grid g-b">
    <section class="card">
      <div class="card-h">
        <div>
          <h2 id="tabTitle">Transporters</h2>
          <p class="sub" id="tabSub"></p>
        </div>
        <div class="seg" role="group" aria-label="Breakdown" id="segTab">
          <button type="button" data-t="tr" aria-pressed="true">Transporters</button>
          <button type="button" data-t="truck" aria-pressed="false">Trucks</button>
          <button type="button" data-t="route" aria-pressed="false">Routes</button>
        </div>
      </div>
      <div class="blist scroll" id="tabList"></div>
    </section>

    <section class="card">
      <div class="card-h"><div><h2>Payment status</h2><p class="sub">Trips in the current view</p></div></div>
      <div id="status"></div>
      <div class="divider"></div>
      <h2 style="font-size:19px">Days from challan to unloading</h2>
      <div class="hist" id="hist"></div>
    </section>
  </div>

  <section class="card" style="margin-top:14px">
    <div class="card-h">
      <div>
        <h2>Advances and deductions</h2>
        <p class="sub">HSD Amount, Cash Adv, Bank Adv, Other Ded. and TDS Amt. in INR for the trips in view</p>
      </div>
    </div>
    <div class="money-h" id="moneyTiles"></div>
    <div class="mstack" id="moneyStack" role="img" aria-label="Share of each deduction"></div>
    <div class="legend" id="moneyLegend"></div>
    <div class="mtscroll"><table id="moneyTbl"></table></div>
  </section>

  <section class="card tcard">
    <div class="card-h">
      <div>
        <h2>Pass-wise trip details</h2>
        <p class="sub" id="tblSub"></p>

function decorate(r) {
  const o = Object.assign({}, r);
  o.pass = r.pass_ || '-'; o.permit = r.permit || 'Unknown'; o.broker = r.broker || 'Unknown'; o.truck = r.truck || '-';
  o.tp = r.tp || (o.permit + '/' + o.pass);
  o.route = (r.lp || '?') + ' to ' + (r.up || '?');
  o.transit = (r.cd && r.ud) ? Math.round((Date.parse(r.ud) - Date.parse(r.cd)) / 864e5) : null;
  o.hay = [o.tp, o.pass, o.permit, o.truck, o.broker, r.owner, r.holder, r.lp, r.up, r.ws, r.party, r.cons, r.st].join(' ').toLowerCase();
  return o;
}

const S = { q:'', tr:'', permit:'', route:'', from:'', to:'', metric:'trips', basis:'cd', tab:'tr', view:'flat',
            sort:{k:'cd', dir:-1}, closed:new Set() };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (x, d=2) => Number(x).toLocaleString('en-IN', {minimumFractionDigits:d, maximumFractionDigits:d});

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dShort = iso => iso ? (+iso.slice(8,10) + ' ' + MON[+iso.slice(5,7)-1]) : '-';
const dFull = iso => iso ? (+iso.slice(8,10) + ' ' + MON[+iso.slice(5,7)-1] + ' ' + iso.slice(0,4)) : '-';
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const stClass = s => s === 'Already Paid' ? 'paid' : s === 'Received' ? 'recv' : 'unl';

function filt(skip) {
  const toks = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  return ROWS.filter(r =>
    toks.every(t => r.hay.includes(t)) &&
    (skip==='tr' || !S.tr || r.broker===S.tr) &&
    (skip==='permit' || !S.permit || r.permit===S.permit) &&
    (skip==='route' || !S.route || r.route===S.route) &&
    (!S.from || r.cd >= S.from) && (!S.to || r.cd <= S.to));
}
const isFiltered = () => !!(S.q || S.tr || S.permit || S.route || S.from || S.to);

/* ---------- KPIs ---------- */
function renderKpis(rows) {
  const n = rows.length, mt = sum(rows, r => r.un);
  const trucks = new Set(rows.map(r => r.truck)).size;
  const trs = new Set(rows.map(r => r.broker)).size;
  const permits = new Set(rows.map(r => r.permit)).size;
  const tp = new Set(rows.map(r => r.tp)).size;
  const tr = rows.filter(r => r.transit != null);
  const avgT = tr.length ? sum(tr, r => r.transit) / tr.length : 0;
  const shr = rows.filter(r => r.sh > 0);
  const k = [
    ['Trips', ni(n), '', isFiltered() ? 'of ' + ni(TOTAL) + ' challans' : 'challans in period'],
    ['UL Net', nf(mt,1), 'MT', n ? 'avg ' + nf(mt/n,1) + ' MT per trip' : ' '],
    ['Trucks', ni(trucks), '', trucks ? nf(n/trucks,1) + ' trips per truck' : ' '],
    ['Transporters', ni(trs), '', ' '],
    ['Permits', ni(permits), '', ni(tp) + ' pass numbers'],
    ['Avg transit', n ? nf(avgT,1) : '0', 'days', 'challan to unloading'],
    ['Shortage', nf(sum(rows, r => r.sh),1), 'MT', ni(shr.length) + ' trips with shortage'],
  ];
  if (n) {
    const cnt = {}; rows.forEach(r => cnt[r.broker] = (cnt[r.broker]||0)+1);
    k[3][3] = 'top: ' + Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0];
  }
  $('kpis').innerHTML = k.map(x => `<div class="kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}${x[2] ? '<small>'+x[2]+'</small>' : ''}</div><div class="s" title="${esc(x[3])}">${esc(x[3])}</div></div>`).join('');
}

function renderInsight(rows) {
  if (!rows.length) { $('insight').innerHTML = 'No trips match the current search and filters.'; return; }
  const by = (f) => { const m = {}; rows.forEach(r => m[f(r)] = (m[f(r)]||0)+1); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const t = by(r => r.broker)[0], p = by(r => r.permit)[0], d = by(r => r.cd)[0];
  const pct = Math.round(t[1] / rows.length * 100);
  $('insight').innerHTML = `<b>${esc(t[0])}</b> moved ${pct}% of these trips. <b>${esc(p[0])}</b> is the busiest permit with ${p[1]} trips, and the peak challan day was <b>${dShort(d[0])}</b> with ${d[1]} trips.`;
}

/* ---------- trend chart ---------- */
function renderTrend(rows) {
  const key = S.basis;
  const all = ROWS.map(r => r[key]).filter(Boolean).sort();
  const days = [];
  for (let t = Date.parse(all[0]); t <= Date.parse(all[all.length-1]); t += 864e5) days.push(new Date(t).toISOString().slice(0,10));
  const agg = {}; days.forEach(d => agg[d] = {n:0, mt:0});
  rows.forEach(r => { if (agg[r[key]]) { agg[r[key]].n++; agg[r[key]].mt += r.un; } });
  const val = d => S.metric === 'trips' ? agg[d].n : agg[d].mt;
  const max = Math.max(1, ...days.map(val));
  const step = max <= 6 ? 1 : max <= 12 ? 2 : max <= 30 ? 5 : max <= 60 ? 10 : max <= 150 ? 25 : max <= 300 ? 50 : max <= 600 ? 100 : 200;
  const top = Math.ceil(max / step) * step;
  const W = 760, H = 320, L = 40, R = 8, T = 18, B = 34;
  const iw = W - L - R, ih = H - T - B, bw = iw / days.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily ${S.metric === 'trips' ? 'trip count' : 'UL Net in MT'} by ${key === 'cd' ? 'challan' : 'unloading'} date">`;
  for (let v = 0; v <= top; v += step) {
    const y = T + ih - v / top * ih;
    s += `<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${v}</text>`;
  }
  const clickable = key === 'cd';
  days.forEach((d, i) => {
    const v = val(d), h = v / top * ih, x = L + i * bw, y = T + ih - h;
    const active = S.from && S.from === S.to && S.from === d;
    const dim = S.from && S.from === S.to && S.from !== d;
    const label = S.metric === 'trips' ? v : Math.round(v);
    s += `<g><title>${dFull(d)}: ${agg[d].n} trips, ${nf(agg[d].mt,1)} MT</title>`;
    s += `<rect class="hit${clickable ? ' click' : ''}" data-d="${d}" x="${x}" y="${T}" width="${bw}" height="${ih}"/>`;
    s += `<rect class="bar${dim ? ' dim' : ''}" x="${x + bw*0.16}" y="${y}" width="${bw*0.68}" height="${Math.max(h, v ? 1.5 : 0)}" rx="2" ${active ? 'style="fill:var(--accent)"' : ''} pointer-events="none"/>`;
    if (v) s += `<text class="val" x="${x + bw/2}" y="${y - 4}" text-anchor="middle">${label}</text>`;
    s += `<text x="${x + bw/2}" y="${H - B + 14}" text-anchor="middle">${+d.slice(8)}</text></g>`;
  });
  const m0 = MON[+days[0].slice(5,7)-1], y0 = days[0].slice(0,4);
  s += `<text x="${L}" y="${H-4}">${m0} ${y0}</text></svg>`;
  $('trend').innerHTML = s;
  $('trendSub').textContent = clickable ? 'Click a day to filter to that challan date' : 'Showing unloading dates. Date filters apply to challan date.';
}

/* ---------- bar lists ---------- */
function barList(items, metricFn, active, colorFn, noteFn) {
  if (!items.length) return '<div class="empty-note">Nothing to show for the current filters.</div>';
  const mx = Math.max(...items.map(i => metricFn(i)), 1);
  return items.map(i => `<button type="button" class="brow${active === i.key ? ' on' : ''}" data-k="${esc(i.key)}" aria-pressed="${active === i.key}">
    <span class="t"><span class="nm" title="${esc(i.key)}">${esc(i.label || i.key)}</span><span class="vv"><b>${i.n}</b><span>${nf(i.mt,1)} MT</span></span></span>
    <span class="track"><i style="width:${Math.max(2, metricFn(i)/mx*100)}%;${colorFn ? 'background:'+colorFn(i) : ''}"></i></span>
    ${noteFn ? '<span class="note">'+esc(noteFn(i))+'</span>' : ''}</button>`).join('');
}
function group(rows, f) {
  const m = new Map();
  rows.forEach(r => { const k = f(r); if (!m.has(k)) m.set(k, {key:k, n:0, mt:0, rows:[]}); const g = m.get(k); g.n++; g.mt += r.un; g.rows.push(r); });
  const mf = S.metric === 'trips' ? (g => g.n) : (g => g.mt);
  return [...m.values()].sort((a,b) => mf(b) - mf(a) || b.n - a.n);
}
const metricFn = g => S.metric === 'trips' ? g.n : g.mt;

function renderPermits() {
  const g = group(filt('permit'), r => r.permit);
  $('permitList').innerHTML = barList(g, metricFn, S.permit, i => PCOL[i.key],
    i => new Set(i.rows.map(r => r.pass)).size + ' pass numbers, ' + new Set(i.rows.map(r => r.truck)).size + ' trucks');
}
function renderTab() {
  const t = S.tab;
  $('tabTitle').textContent = t === 'tr' ? 'Transporters' : t === 'truck' ? 'Trucks' : 'Routes';
  let html = '';
  if (t === 'tr') {
    $('tabSub').textContent = 'Agent / broker name. Select one to filter.';
    html = barList(group(filt('tr'), r => r.broker), metricFn, S.tr, null, i => pl(new Set(i.rows.map(r => r.truck)).size, 'truck') + ', ' + pl(new Set(i.rows.map(r => r.permit)).size, 'permit'));
  } else if (t === 'truck') {
    $('tabSub').textContent = 'Select a truck to search its trips.';
    html = barList(group(filt(), r => r.truck), metricFn, S.q.trim().toUpperCase(), null, i => i.rows[0].broker);
  } else {
    $('tabSub').textContent = 'Loading point to unloading point.';
    html = barList(group(filt('route'), r => r.route), metricFn, S.route, null, i => i.rows[0].cons ? 'Consignee ' + i.rows[0].cons : '');
  }
  $('tabList').innerHTML = html;
}
function renderStatus(rows) {
  const g = group(rows, r => r.st || 'Unknown'), n = rows.length || 1;
  const col = {'Already Paid':'var(--paid)', 'Received':'var(--c3)', 'Unloaded':'var(--unl)'};
  $('status').innerHTML = rows.length ? `<div class="stack" role="img" aria-label="Payment status split">${g.map(x => `<i style="width:${x.n/n*100}%;background:${col[x.key]||'var(--muted)'}" title="${esc(x.key)}: ${x.n}"></i>`).join('')}</div>
    <div class="legend">${g.map(x => `<span><em style="background:${col[x.key]||'var(--muted)'}"></em>${esc(x.key)} <b>${x.n}</b> (${nf(x.mt,1)} MT)</span>`).join('')}</div>` : '<div class="empty-note">No trips in view.</div>';
  const b = [0,0,0,0]; rows.forEach(r => { if (r.transit != null) b[Math.min(3, Math.max(0, r.transit))]++; });
  const mx = Math.max(1, ...b);
  $('hist').innerHTML = b.map((v,i) => `<div><b>${v}</b><i style="height:${v/mx*66}px"></i><span>${i === 3 ? '3+' : i} ${i===1?'day':'days'}</span></div>`).join('');
}

/* ---------- advances and deductions ---------- */
const MONEY = [
  {k:'hsda', l:'HSD Amount', c:'var(--c3)'},

function renderMoney(rows) {
  const tot = MONEY.map(m => sum(rows, r => r[m.k])), all = tot.reduce((a,b) => a + b, 0);

/* ---------- data loading: CSV parse, merge, live file, upload ---------- */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function parseDate(s) {
  s = (s || '').trim(); let m;
  if ((m = s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[A-Za-z]*[-\/ ](\d{2,4})$/))) {
    const mi = MON.findIndex(x => x.toLowerCase() === m[2].toLowerCase()); if (mi < 0) return null;
    const y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
    return y + '-' + String(mi + 1).padStart(2, '0') + '-' + String(+m[1]).padStart(2, '0');
  }
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return m[1] + '-' + m[2] + '-' + m[3];
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return m[3] + '-' + String(+m[2]).padStart(2, '0') + '-' + String(+m[1]).padStart(2, '0');
  return null;
}
const REQUIRED = ['SlNo', 'Challan Date', 'Truck Number', 'Unloading Date', 'UL Net', 'Agent/Broker Name', 'Permit Number', 'Pass Number'];
function csvToRows(text, name) {
  const grid = parseCSV(text);
  const hi = grid.findIndex(r => (r[0] || '').trim() === 'SlNo');
  if (hi < 0) throw new Error(name + ': could not find the header row that starts with "SlNo". Is this the Challan Unload export?');
  const head = [], seen = {};
  grid[hi].forEach(h => { h = (h || '').trim(); seen[h] = (seen[h] || 0) + 1; head.push(seen[h] > 1 ? h + '_' + seen[h] : h); });
  const missing = REQUIRED.filter(h => !head.includes(h));
  if (missing.length) throw new Error(name + ': missing column' + (missing.length > 1 ? 's' : '') + ' ' + missing.join(', ') + '.');
  const idx = {}; head.forEach((h, i) => idx[h] = i);
  const g = (r, h) => idx[h] === undefined ? '' : (r[idx[h]] || '').trim();
  const num = v => { const n = parseFloat(String(v).replace(/,/g, '')); return isNaN(n) ? 0 : Math.round(n * 1000) / 1000; };
  const txt = v => v === '' ? null : v;
  const titleText = grid.slice(0, hi).map(r => r.join(' ')).join(' ');
  const pm = titleText.match(/For the Period\s+([0-9A-Za-z-]+\s+to\s+[0-9A-Za-z-]+)/i);
  const rows = []; let skipped = 0;
  grid.slice(hi + 1).forEach(r => {
    const sl = g(r, 'SlNo');
    if (sl === '') return;
    if (!/^\d+$/.test(sl)) { skipped++; return; }
    const cd = parseDate(g(r, 'Challan Date'));
    if (!cd) { skipped++; return; }
    rows.push({
      id: +g(r, 'SlNo'), ws: txt(g(r, 'WS/Inv. Number')), cd, ud: parseDate(g(r, 'Unloading Date')),
      tp: txt(g(r, 'TP Number')), truck: txt(g(r, 'Truck Number')), permit: txt(g(r, 'Permit Number')), pass_: txt(g(r, 'Pass Number')),
      broker: txt(g(r, 'Agent/Broker Name')), owner: txt(g(r, 'Vehicle Owner Name')), holder: txt(g(r, 'Challan Hold Name')),
      lg: num(g(r, 'L Gross')), lt: num(g(r, 'L Tare')), ln: num(g(r, 'L Net')),
      ug: num(g(r, 'UL Gross')), ut: num(g(r, 'UL Tare')), un: num(g(r, 'UL Net')), sh: num(g(r, 'Shrt Qty')),
      rate: num(g(r, 'Rate @')), fr: num(g(r, 'Freight Amt')), ca: num(g(r, 'Cash Adv')), ba: num(g(r, 'Bank Adv')),
      hsdl: num(g(r, 'HSD Ltr')), hsda: num(g(r, 'HSD Amount')), pump: txt(g(r, 'Petrol Pump')),
      od: num(g(r, 'Other Ded.')), dtw: txt(g(r, 'Deduction Towards')), tds: num(g(r, 'TDS Amt.')), td: num(g(r, 'Tot. Deduction')), net: num(g(r, 'Net Amount')),
      cons: txt(g(r, 'Consignee')), party: txt(g(r, 'Billing Party')), lp: txt(g(r, 'Loading Point')), up: txt(g(r, 'Unloading Point')),
      ref: txt(g(r, 'Ref No.')), rcv: parseDate(g(r, 'Received Date')), pay: parseDate(g(r, 'Payment Date')), bank: txt(g(r, 'Bank Name')),
      cc: txt(g(r, 'Collection Center')), vt: txt(g(r, 'Vehicle Type')), st: txt(g(r, 'Bill Date'))
    });
  });
  if (!rows.length) throw new Error(name + ': no trip rows found under the header.');
  return { name, rows, skipped, period: pm ? pm[1] : '' };
}
function mergeParts(parts) {
  const m = new Map(); let n = 0;
  parts.forEach(p => p.rows.forEach(r => { n++; m.set(r.tp || (r.permit + '/' + r.pass_ + '/' + r.cd), r); }));
  return { rows: [...m.values()], duplicates: n - m.size, skipped: parts.reduce((s, p) => s + p.skipped, 0) };
}

async function loadLive() {
  setNotice('', '');
  let files = ['DASHBOARD.csv'], lastMod = null;
  try {
    try { const r = await fetch(DATA_DIR + 'files.json', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); if (Array.isArray(j) && j.length) files = j; } } catch (e) {}
    const parts = [];
    for (const f of files) {
      const res = await fetch(DATA_DIR + encodeURIComponent(f), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + f);
      lastMod = res.headers.get('Last-Modified') || lastMod;
      parts.push(csvToRows(await res.text(), f));
    }
    const m = mergeParts(parts);
    const upd = lastMod ? ', file updated ' + new Date(lastMod).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    setData(m.rows, { period: parts.length === 1 ? parts[0].period : '', source: files.map(f => DATA_DIR + f).join(' + ') + upd });
    $('liveBtn').hidden = true;
  } catch (err) {
    loadEmbedded('Live data file was not found or could not be read (' + err.message + '), so the built-in snapshot of ' + EMBED.rows.length + ' trips is shown. Use Upload CSV to load a newer export.');
  }
}
async function handleFiles(fileList) {
  const files = [...fileList].filter(f => /\.csv$/i.test(f.name) || f.type === 'text/csv');
  if (!files.length) { setNotice('err', 'Please choose a .csv file.'); return; }
  try {
    const parts = [];
    for (const f of files) parts.push(csvToRows(await f.text(), f.name));
    const m = mergeParts(parts);
    setData(m.rows, { period: parts.length === 1 ? parts[0].period : '', source: 'uploaded ' + files.map(f => f.name).join(' + ') });
    $('liveBtn').hidden = false;
    const base = 'Loaded ' + m.rows.length + ' trips from ' + files.map(f => f.name).join(' + ') +
      (m.duplicates ? ', ' + m.duplicates + ' repeated TP numbers merged' : '') +
      (m.skipped ? ', ' + m.skipped + (m.skipped === 1 ? ' row' : ' rows') + ' skipped (bad date or number)' : '') + '. ';
    if (MODE === 'artifact') {
      PENDING = { rows: m.rows, period: parts.length === 1 ? parts[0].period : '', source: 'uploaded ' + files.map(f => f.name).join(' + ') };
      setNotice('ok', base + 'Only you can see this preview. Check the numbers, then publish it so everyone sees this data until your next upload.', { pub: true });
    } else {
      setNotice('ok', base + 'This upload is a preview in your browser only. To update the public dashboard, replace data/DASHBOARD.csv in the GitHub repository.');
    }
  } catch (err) {
    setNotice('err', err.message + ' The dashboard still shows the previous data.');
  }
}

async function publishNow() {
  if (!PENDING) return;
  let art = null;

  if (!art) { setNotice('err', 'Publishing only works on the claude.ai page of this dashboard, opened by its owner. Your preview is still shown.', { pub: true }); return; }
  setNotice('warn', 'Publishing. The page will reload with the new data in a moment.', { pub: true, busy: true });

  } catch (e) {
    const c = e && e.code;

      ? 'Only the dashboard owner can publish new data. Your preview is still shown.'

      : 'Publishing failed (' + (c || 'unknown error') + '). Your preview is still shown; try again.';

  $('segBasis').onclick = e => { const b = e.target.closest('button'); if (b) { S.basis = b.dataset.b; render(); } };
  $('segTab').onclick = e => { const b = e.target.closest('button'); if (b) { S.tab = b.dataset.t; render(); } };
  $('segView').onclick = e => { const b = e.target.closest('button'); if (b) { S.view = b.dataset.v; render(); } };
  $('trend').onclick = e => { const h = e.target.closest('.hit.click'); if (!h) return; const d = h.dataset.d; if (S.from === d && S.to === d) { S.from = S.to = ''; } else { S.from = S.to = d; } render(); };
  $('permitList').onclick = e => { const b = e.target.closest('.brow'); if (b) toggle('permit', b.dataset.k); };
  $('tabList').onclick = e => {
    const b = e.target.closest('.brow'); if (!b) return;
    if (S.tab === 'tr') toggle('tr', b.dataset.k);
    else if (S.tab === 'route') toggle('route', b.dataset.k);
    else { S.q = S.q.trim().toUpperCase() === b.dataset.k ? '' : b.dataset.k; render(); }
  };
  $('moneyTbl').onclick = e => { const r = e.target.closest('tr.mr'); if (r) toggle('tr', r.dataset.k); };
  $('tbl').onclick = e => {
    if (e.target.closest('[data-reset]')) return resetAll();
    const th = e.target.closest('th button');
    if (th) { const k = th.dataset.k; S.sort = S.sort.k === k ? {k, dir:-S.sort.dir} : {k, dir:(COLS.find(c => c.k === k).num || k==='cd' || k==='ud') ? -1 : 1}; return renderTable(filt()); }
    const g = e.target.closest('tr.grp');
    if (g) { const p = g.dataset.p; S.closed.has(p) ? S.closed.delete(p) : S.closed.add(p); return renderTable(filt()); }
    const t = e.target.closest('tr.trip'); if (t) openTrip(t.dataset.id);
  };
  $('tbl').onkeydown = e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const t = e.target.closest('tr.trip, tr.grp'); if (!t || e.target.closest('th')) return;
    e.preventDefault(); t.click();
  };
  $('dClose').onclick = closeTrip; $('scrim').onclick = closeTrip;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('drawer').hidden) closeTrip();
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') { e.preventDefault(); $('q').focus(); }
  });

  const root = document.documentElement, tb = $('themeBtn');
  const dark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const label = () => { tb.textContent = dark() ? 'Light mode' : 'Dark mode'; };
  tb.onclick = () => { root.dataset.theme = dark() ? 'light' : 'dark'; label(); };
  label();

  $('uploadBtn').onclick = () => $('file').click();
  $('file').onchange = e => { const fl = [...e.target.files]; e.target.value = ''; if (fl.length) handleFiles(fl); };
  $('liveBtn').onclick = () => (MODE === 'artifact' ? loadEmbedded() : loadLive());
  $('pubBtn').onclick = publishNow;
  $('noticeX').onclick = () => setNotice('', '');
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; $('drop').hidden = false; } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('drop').hidden = true; });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('drop').hidden = true; if (!window.__readOnly && e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

  if (MODE === 'artifact') {
    $('liveBtn').textContent = 'Discard upload';
    loadEmbedded();
    (async () => {  // hide upload for viewers who are explicitly read-only
      try {
        const u = window.claude && window.claude.use ? await window.claude.use('user') : null;
        if (u && typeof u.canEdit === 'function' && u.canEdit() === false) {
          $('uploadBtn').hidden = true; $('liveBtn').hidden = true;
          window.__readOnly = true;
        }
      } catch (e) {}
    })();
  } else loadLive();
}
init();</script></body></html>
